<!doctype html>
<html lang="ru" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <title>Verstak</title>
    <meta
      name="description"
      content="Единая программа для работы с OpenCode: проекты, сессии, задачи, файлы, статистика и подключение с телефона."
    />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Verstak" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />

    <!--
      Тема применяется до отрисовки, иначе на тёмной теме первый кадр
      мелькает светлым. Скрипт намеренно синхронный и маленький: он должен
      выполниться до того, как браузер нарисует страницу.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('verstak.theme')
          if (stored === 'light' || stored === 'dark' || stored === 'system') {
            var root = document.documentElement
            if (stored === 'system') root.removeAttribute('data-theme')
            else root.setAttribute('data-theme', stored)
          }
        } catch (error) {
          // Приватный режим: остаётся системная тема.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
